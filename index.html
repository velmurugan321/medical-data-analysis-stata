<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Analytics Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --navy:#0b1220;
    --navy2:#111c35;
    --blue:#2563eb;
    --blue2:#3b82f6;
    --cyan:#06b6d4;
    --green:#10b981;
    --red:#ef4444;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --shadow:0 15px 40px rgba(15,23,42,.08);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',system-ui,sans-serif;
    background:
        radial-gradient(circle at 10% 0%,rgba(37,99,235,.08),transparent 28%),
        radial-gradient(circle at 90% 10%,rgba(6,182,212,.07),transparent 25%),
        var(--bg);
    color:var(--text);
    line-height:1.6;
}

h1,h2,h3,h4,.logo{
    font-family:'Manrope','Inter',sans-serif;
}

a{
    text-decoration:none;
    color:inherit;
}

/* NAVBAR */

.navbar{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(226,232,240,.8);
}

.nav-container{
    max-width:1200px;
    margin:auto;
    padding:16px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:800;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:18px;
    background:linear-gradient(135deg,var(--blue),var(--cyan));
