<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Analytics Lab</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
    line-height:1.6;
}

.navbar{
    background:#0b1220;
    color:white;
    padding:16px 20px;
    position:sticky;
    top:0;
    z-index:100;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.nav a{
    color:white;
    margin-left:20px;
    text-decoration:none;
    font-size:14px;
}

.hero{
    background:linear-gradient(135deg,#0b1220,#173b78);
    color:white;
    padding:70px 20px;
}

.hero-inner{
    max-width:1100px;
    margin:auto;
}

.badge{
    display:inline-block;
    background:#2563eb;
    padding:7px 13px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:18px;
}

.hero h1{
    font-size:45px;
    max-width:750px;
    line-height:1.15;
    margin-bottom:20px;
}

.hero p{
    max-width:700px;
    color:#dbeafe;
    font-size:17px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:50px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:35px;
}

.section-title h2{
    font-size:30px;
    margin-bottom:8px;
}

.section-title p{
    color:#64748b;
}

.modules{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:16px;
    padding:25px;
    box-shadow:0 8px 25px rgba(15,23,42,.06);
}

.card-icon{
    font-size:30px;
    margin-bottom:12px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#64748b;
    font-size:14px;
}

.workspace{
    margin-top:50px;
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
    border:1px solid #e2e8f0;
}

.workspace h2{
    margin-bottom:8px;
}

.workspace>p{
    color:#64748b;
    margin-bottom:25px;
}

.inputs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.input-box label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:16px;
}

.buttons{
    margin-top:20px;
}

button{
    background:#2563eb;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin-right:8px;
}

button:hover{
    background:#1d4ed8;
}

button.secondary{
    background:#0f766e;
}

.results{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:25px;
}

.result{
    background:#f8fafc;
    border-radius:10px;
    padding:18px;
    border:1px solid #e2e8f0;
}

.result small{
    color:#64748b;
}

.result strong{
    display:block;
    font-size:24px;
    margin-top:5px;
}

.demo{
    margin-top:35px;
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:18px;
    border-radius:8px;
}

footer{
    background:#0b1220;
    color:#cbd5e1;
    text-align:center;
    padding:30px 20px;
    margin-top:30px;
}

@media(max-width:800px){
    .modules{
        grid-template-columns:1fr;
