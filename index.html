<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Analytics Lab</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:#102a43;
    color:white;
    padding:25px 18px;
}

.logo{
    font-size:21px;
    font-weight:700;
    margin-bottom:35px;
}

.logo span{
    color:#38bdf8;
}

.nav{
    list-style:none;
}

.nav li{
    padding:13px 15px;
    margin:7px 0;
    border-radius:9px;
    cursor:pointer;
    color:#cbd5e1;
}

.nav li:hover,
.nav .active{
    background:#1d4e70;
    color:white;
}

/* MAIN */
.main{
    margin-left:250px;
    min-height:100vh;
}

/* TOPBAR */
.topbar{
    height:70px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
}

.search{
    background:#f1f5f9;
    border:0;
    border-radius:9px;
    padding:11px 16px;
    width:280px;
}

.profile{
    font-weight:600;
}

/* CONTENT */
.content{
    padding:35px;
}

.welcome h1{
    font-size:30px;
    margin-bottom:6px;
}

.welcome p{
    color:#64748b;
}

/* CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:30px;
}

.stat-card{
    background:white;
    border-radius:15px;
    padding:22px;
    box-shadow:0 4px 15px rgba(15,23,42,.05);
}

.stat-title{
    color:#64748b;
    font-size:14px;
}

.stat-number{
    font-size:28px;
    font-weight:700;
    margin-top:8px;
    color:#123b5d;
}

/* SECTION */
.section-title{
    margin:35px 0 18px;
    font-size:21px;
}

/* MODULES */
.modules{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.module{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 4px 15px rgba(15,23,42,.05);
    cursor:pointer;
    transition:.2s;
}

.module:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 25px rgba(15,23,42,.10);
}

.icon{
    width:45px;
    height:45px;
    border-radius:10px;
    background:#e0f2fe;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    margin-bottom:15px;
}

.module h3{
    margin-bottom:7px;
}
