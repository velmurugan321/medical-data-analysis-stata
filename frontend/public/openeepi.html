<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenEpi | Medical Analytics Lab</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#172033}.shell{display:flex;min-height:100vh}.side{width:285px;background:#0b1324;color:#dbe5f4;padding:14px;overflow:auto}.brand{font-size:18px;font-weight:900;padding:12px;border-bottom:1px solid #26334b}.brand small{display:block;font-size:10px;color:#91a0b8;margin-top:4px}.nav-title{font-size:10px;color:#71809a;letter-spacing:.12em;margin:16px 8px 6px}.nav button,.nav a{display:block;width:100%;padding:9px 10px;margin:2px 0;border:0;border-radius:8px;background:transparent;color:#c8d2e3;text-align:left;text-decoration:none;font-size:13px;cursor:pointer}.nav button:hover,.nav a:hover{background:#18243b;color:#fff}.main{flex:1}.top{background:#fff;border-bottom:1px solid #dfe5ee;padding:18px 26px;display:flex;justify-content:space-between}.top h1{margin:0;font-size:21px}.top p{margin:4px 0;color:#667085;font-size:12px}.back{color:#1d4ed8;text-decoration:none;font-weight:800;font-size:12px}.content{max-width:1100px;margin:auto;padding:28px}.hero,.card{background:#fff;border:1px solid #dfe5ee;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 8px 25px #0f172a0b}.hero{background:linear-gradient(135deg,#0b1324,#1b4774);color:#fff}.hero h2{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.field textarea{min-height:110px;font-family:monospace}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#edf4ff;color:#1d4ed8}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.error{margin-top:14px;background:#fff1f2;color:#b42318;padding:11px;border-radius:9px}.success{margin-top:14px;background:#ecfdf3;color:#067647;padding:11px;border-radius:9px}.table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}.table td,.table th{border-bottom:1px solid #e5e7eb;padding:9px;text-align:right}.table td:first-child,.table th:first-child{text-align:left}.note{font-size:11px;color:#667085;line-height:1.6}@media(max-width:750px){.shell{display:block}.side{width:100%;max-height:45vh}.grid{grid-template-columns:1fr 1fr}.content{padding:14px}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><div class="brand">🧮 OpenEpi<small>Medical Analytics Lab · full menu</small></div><div class="nav"><div class="nav-title">MAIN</div><button onclick="home()">Home</button><button onclick="help()">Info and Help</button><button onclick="settings()">Language / Options / Settings</button><div class="nav-title">COUNTS</div><button onclick="openM('smr')">Std. Mort. Ratio</button><button onclick="openM('proportion')">Proportion</button><button onclick="openM('two')">Two by Two Table</button><button onclick="openM('dose')">Dose-Response</button><button onclick="openM('rc')">R by C Table</button><button onclick="openM('match')">Matched Case Control</button><button onclick="openM('screening')">Screening</button><div class="nav-title">PERSON TIME</div><button onclick="openM('rate')">1 Rate</button><button onclick="openM('compare_rates')">Compare 2 Rates</button><div class="nav-title">CONTINUOUS VARIABLES</div><button onclick="openM('mean')">Mean CI</button><button onclick="openM('median')">Median / %ile CI</button><button onclick="openM('ttest')">t test</button><button onclick="openM('anova')">ANOVA</button><div class="nav-title">SAMPLE SIZE</div><button onclick="openM('ss_proportion')">Proportion</button><button onclick="openM('ss_cc')">Unmatched CC</button><button onclick="openM('ss_cohort')">Cohort / RCT</button><button onclick="openM('ss_mean')">Mean Difference</button><div class="nav-title">POWER</div><button onclick="openM('power_proportion')">X-Sectional</button><button onclick="openM('power_cc')">Unmatched CC</button><button onclick="openM('power_cohort')">Cohort</button><button onclick="openM('power_rct')">Clinical Trial</button><button onclick="openM('power_mean')">Mean Difference</button><div class="nav-title">TOOLS</div><button onclick="openM('random')">Random numbers</button><div class="nav-title">SEARCHES</div><a href="https://www.google.com/" target="_blank" rel="noopener">Google -- Internet</a><a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubMed -- MEDLARS</a><button onclick="links()">Internet Links</button><a href="https://www.openepi.com/" target="_blank" rel="noopener">Official OpenEpi</a><button onclick="development()">Development</button></div></aside><main class="main"><header class="top"><div><h1 id="title">OpenEpi</h1><p id="sub">Epidemiology & biostatistics calculators</p></div><a class="back" href="./index.html">← Dashboard</a></header><section class="content" id="app"></section></main></div><script>
const API='https://medical-data-analysis-api.onrender.com',app=document.getElementById('app'),title=document.getElementById('title'),sub=document.getElementById('sub');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=id=>Number(document.getElementById(id).value);const fmt=x=>x==null||!Number.isFinite(Number(x))?'—':Number(x).toFixed(5).replace(/0+$/,'').replace(/\.$/,'');
const M={
smr:['Std. Mort. Ratio',[['observed','Observed deaths'],['expected','Expected deaths']]],proportion:['Proportion',[['x','Events'],['n','Total'],['confidence','Confidence %']]],two:['Two by Two Table',[['a','a'],['b','b'],['c','c'],['d','d']]],dose:['Dose-Response',null],rc:['R by C Table',null],match:['Matched Case Control',[['b','Discordant b'],['c','Discordant c']]],screening:['Screening',[['tp','True Positive (TP)'],['fp','False Positive (FP)'],['fn','False Negative (FN)'],['tn','True Negative (TN)']]],rate:['1 Rate',[['events','Events'],['person_time','Person-time']]],compare_rates:['Compare 2 Rates',[['e1','Events group 1'],['pt1','Person-time group 1'],['e2','Events group 2'],['pt2','Person-time group 2']]],mean:['Mean CI',[['mean','Mean'],['sd','SD'],['n','N'],['confidence','Confidence %']]],median:['Median / %ile CI',null],ttest:['t test',[['m1','Mean 1'],['sd1','SD 1'],['n1','N 1'],['m2','Mean 2'],['sd2','SD 2'],['n2','N 2']]],anova:['ANOVA',null],ss_proportion:['Sample Size — Proportion',[['p','Expected proportion (0–1)'],['margin','Margin of error (0–1)'],['confidence','Confidence %']]],ss_cc:['Sample Size — Unmatched CC',[['p0','Control exposure proportion'],['or','Odds ratio'],['ratio','Controls:Cases ratio']]],ss_cohort:['Sample Size — Cohort / RCT',null],ss_mean:['Sample Size — Mean Difference',[['sd','Common SD'],['diff','Mean difference'],['confidence','Confidence %'],['power','Power %']]],power_proportion:['Power — X-Sectional',[['n','Sample size'],['p','Expected proportion'],['p0','Null proportion']]],power_cc:['Power — Unmatched CC',null],power_cohort:['Power — Cohort',null],power_rct:['Power — Clinical Trial',null],power_mean:['Power — Mean Difference',null],random:['Random numbers',[['n','Count'],['low','Minimum'],['high','Maximum'],['seed','Seed (optional)']]]};
function home(){title.textContent='OpenEpi';sub.textContent='Epidemiology & biostatistics calculators';app.innerHTML='<div class="hero"><h2>OpenEpi statistical workspace</h2><p>All titles in the OpenEpi menu are now clickable. Calculations are routed to the Python/FastAPI backend where an implementation exists; no fake result is shown for modules needing further algorithm validation.</p></div><div class="card"><b>Full menu covered:</b><p>Counts · Person Time · Continuous Variables · Sample Size · Power · Random numbers · Searches · Settings.</p></div>'}
function help(){title.textContent='Info and Help';sub.textContent='Methods and input conventions';app.innerHTML='<div class="card"><h2>Input rules</h2><p>Counts must be non-negative whole numbers. Screening uses TP, FP, FN, TN. Two-by-two uses a,b,c,d. Matrix/list modules accept JSON.</p><p class="note">The official OpenEpi documentation lists the same calculator families and modules. Different legacy OpenEpi modules may offer multiple CI methods; the backend reports the method actually used.</p></div>'}
function settings(){title.textContent='Language / Options / Settings';sub.textContent='Session preferences';app.innerHTML='<div class="card"><h2>Settings</h2><div class="grid"><div class="field"><label>Confidence level</label><input id="conf" value="95" type="number"></div><div class="field"><label>Language</label><input value="English" disabled></div></div><div class="actions"><button class="btn primary" onclick="document.getElementById(\'setout\').innerHTML=\'<div class=success>Settings saved for this session.</div>\'">Save</button></div><div id="setout"></div></div>'}
function links(){title.textContent='Internet Links';sub.textContent='External resources';app.innerHTML='<div class="card"><h2>Resources</h2><p><a href="https://www.openepi.com/" target="_blank">Official OpenEpi</a></p><p><a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank">PubMed</a></p><p><a href="https://www.google.com/" target="_blank">Google</a></p></div>'}
function development(){title.textContent='Development';sub.textContent='Implementation and validation';app.innerHTML='<div class="card"><h2>Backend-first calculation design</h2><p>Frontend collects inputs and renders results. Backend uses Python/SciPy. Implemented modules report their calculation method. Specialized power/sample-size modules that are not yet validated against the official OpenEpi algorithm must not be treated as publication-equivalent.</p></div>'}
function openM(m){const c=M[m];title.textContent=c[0];sub.textContent='OpenEpi calculator';let h='<div class="card"><h2>'+esc(c[0])+'</h2>';if(['dose','rc','median','anova','ss_cohort','power_cc','power_cohort','power_rct','power_mean'].includes(m))h+='<p class="note">Enter JSON in the box below. Example formats are shown in the placeholder.</p><div class="field"><label>JSON input</label><textarea id="json">'+esc(example(m))+'</textarea></div>';else{h+='<div class="grid">';c[1].forEach(x=>h+='<div class="field"><label>'+esc(x[1])+'</label><input id="f_'+x[0]+'" type="number" step="any"></div>');h+='</div>'}h+='<div class="actions"><button class="btn primary" onclick="calc(\''+m+'\')">Calculate</button><button class="btn secondary" onclick="openM(\''+m+'\')">Reset</button></div><div id="out"></div></div>';app.innerHTML=h}
function example(m){return m==='dose'?'{"successes":[10,20,30],"totals":[100,100,100]}':m==='rc'?'{"observed":[[10,20],[15,25],[8,12]]}':m==='median'?'{"values":[1,2,3,4,5]}':m==='anova'?'{"groups":[[1,2,3],[2,4,5],[6,7,8]]}':m==='ss_cohort'?'{"p1":0.30,"p0":0.15,"ratio":1}':m==='power_cc'?'{"n_cases":100,"n_controls":100,"p_cases":0.50,"p_controls":0.30}':m==='power_cohort'?'{"n_exposed":100,"n_unexposed":100,"risk_exposed":0.30,"risk_unexposed":0.15}':m==='power_rct'?'{"n1":100,"n2":100,"p1":0.30,"p2":0.15}':'{"sd":10,"diff":5,"confidence":95,"power":80}' }
async function calc(m){const out=document.getElementById('out');out.innerHTML='<div class="success">Calculating…</div>';try{let d={module:m};if(document.getElementById('json'))Object.assign(d,JSON.parse(document.getElementById('json').value));else M[m][1].forEach(x=>{let v=document.getElementById('f_'+x[0]).value;if(v==='')throw new Error(x[1]+' is required');d[x[0]]=Number(v)});const fd=new FormData();fd.append('config',JSON.stringify(d));const r=await fetch(API+'/api/v1/openeepi/calculate',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.detail||'Backend calculation failed');render(j.results)}catch(e){out.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function render(r){let rows=[];const walk=(k,v)=>{if(v==null)return;if(typeof v==='number'&&Number.isFinite(v))rows.push('<tr><td>'+esc(k)+'</td><td>'+fmt(v)+'</td></tr>');else if(typeof v==='string'||typeof v==='boolean')rows.push('<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>');else if(Array.isArray(v)&&v.every(x=>typeof x==='number'))rows.push('<tr><td>'+esc(k)+'</td><td>'+v.map(fmt).join(', ')+'</td></tr>');else if(Array.isArray(v))v.forEach((x,i)=>walk(k+'['+i+']',x));else if(typeof v==='object')Object.keys(v).forEach(x=>walk(k+'.'+x,v[x]))};Object.keys(r).forEach(k=>walk(k,r[k]));document.getElementById('out').innerHTML='<div class="success">Calculation completed by backend.</div><table class="table"><tr><th>Measure</th><th>Result</th></tr>'+rows.join('')+'</table>'}
home();</script></body></html>
