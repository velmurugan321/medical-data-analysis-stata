<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenEpi | Medical Analytics Lab</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#f4f7fb;color:#172033}.shell{display:flex;min-height:100vh}.side{width:280px;background:#0b1324;color:#dbe5f4;padding:16px;overflow:auto}.brand{font-size:18px;font-weight:900;padding:12px;border-bottom:1px solid #26334b;margin-bottom:12px}.brand small{display:block;font-size:10px;color:#91a0b8;margin-top:4px}.nav-title{font-size:10px;color:#71809a;letter-spacing:.12em;margin:16px 8px 6px}.nav button,.nav a,.nav summary{display:block;width:100%;padding:9px 10px;margin:2px 0;border:0;border-radius:8px;background:transparent;color:#c8d2e3;text-align:left;text-decoration:none;font-size:13px;cursor:pointer}.nav button:hover,.nav a:hover,.nav summary:hover{background:#18243b;color:white}.sub{padding-left:12px}.main{flex:1}.top{background:#fff;border-bottom:1px solid #dfe5ee;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:21px}.top p{margin:4px 0 0;color:#667085;font-size:12px}.back{color:#1d4ed8;text-decoration:none;font-weight:800;font-size:12px}.content{max-width:1050px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#0b1324,#1b4774);color:white;padding:28px;border-radius:18px;margin-bottom:18px}.hero h2{margin:0 0 8px;font-size:28px}.hero p{color:#c6d4e8;line-height:1.6}.card{background:white;border:1px solid #dfe5ee;border-radius:16px;padding:22px;box-shadow:0 8px 25px #0f172a0b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:14px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:white}.secondary{background:#edf4ff;color:#1d4ed8}.actions{display:flex;gap:9px;margin-top:18px}.error{margin-top:14px;background:#fff1f2;color:#b42318;border:1px solid #fecdd3;padding:11px;border-radius:9px;font-size:12px}.success{margin-top:14px;background:#ecfdf3;color:#067647;border:1px solid #abefc6;padding:11px;border-radius:9px;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.metric{border:1px solid #dfe5ee;border-radius:10px;padding:13px;background:#fbfdff}.metric small{display:block;color:#667085;font-size:11px}.metric b{display:block;font-size:18px;margin-top:4px}.table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}.table th,.table td{border-bottom:1px solid #e5e7eb;padding:10px;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.note{font-size:11px;color:#667085;line-height:1.6;margin-top:15px}@media(max-width:850px){.side{width:220px}.grid,.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.shell{display:block}.side{width:100%;max-height:48vh}.top{padding:14px 16px}.content{padding:14px}.grid,.metrics{grid-template-columns:1fr}.hero h2{font-size:22px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">🧮 OpenEpi<small>Medical Analytics Lab · validated calculators</small></div><div class="nav"><div class="nav-title">MAIN</div><button onclick="home()">🖥️ Home</button><button onclick="info()">📁 Info and Help</button><button onclick="info()">🌍 Language / Options / Settings</button><div class="nav-title">COUNTS</div><button onclick="coming('Std. Mort. Ratio')">📄 Std. Mort. Ratio</button><button onclick="proportion()">📄 Proportion</button><button onclick="twobytwo()">📄 Two by Two Table</button><button onclick="coming('Dose-Response')">📄 Dose-Response</button><button onclick="coming('R by C Table')">📄 R by C Table</button><button onclick="coming('Matched Case Control')">📄 Matched Case Control</button><button onclick="screening()">📄 Screening</button><div class="nav-title">PERSON TIME</div><button onclick="rate()">📄 1 Rate</button><button onclick="coming('Compare 2 Rates')">📄 Compare 2 Rates</button><div class="nav-title">CONTINUOUS VARIABLES</div><button onclick="meanCI()">📄 Mean CI</button><button onclick="coming('Median / %ile CI')">📄 Median / %ile CI</button><button onclick="ttest()">📄 t test</button><button onclick="coming('ANOVA')">📄 ANOVA</button><div class="nav-title">STUDY DESIGN</div><button onclick="sampleSize()">📁 Sample Size</button><button onclick="coming('Power')">📁 Power</button><button onclick="randomNumbers()">📄 Random numbers</button><div class="nav-title">SEARCHES</div><a href="https://www.google.com/" target="_blank">📄 Google -- Internet</a><a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank">📄 PubMed -- MEDLARS</a><button onclick="info()">📄 Internet Links</button><a href="https://www.openepi.com/" target="_blank">📄 Official OpenEpi</a><button onclick="info()">📁 Development</button></div></aside><main class="main"><header class="top"><div><h1 id="title">OpenEpi</h1><p id="sub">Epidemiology & biostatistics calculators</p></div><a class="back" href="./index.html">← Dashboard</a></header><section class="content" id="app"></section></main></div><script>
const app=document.getElementById('app'),title=document.getElementById('title'),sub=document.getElementById('sub');const API='https://medical-data-analysis-api.onrender.com';const $=id=>document.getElementById(id);const num=id=>Number($(id).value);const pct=x=>x==null||!Number.isFinite(x)?'—':(x*100).toFixed(2)+'%';const val=x=>x==null||!Number.isFinite(x)?'—':Number(x).toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
function home(){title.textContent='OpenEpi';sub.textContent='Epidemiology & biostatistics calculators';app.innerHTML='<div class="hero"><h2>OpenEpi-style statistical workspace</h2><p>Select a calculator from the left. Screening is fully connected to the Medical Data Analysis backend and validates the 2×2 diagnostic table before calculation.</p></div><div class="grid"><div class="card"><b>Screening</b><p>TP, FP, FN, TN → sensitivity, specificity, PPV, NPV, accuracy, LR, DOR, Youden and exact 95% CI.</p><button class="btn primary" onclick="screening()">Open Screening</button></div><div class="card"><b>Proportion</b><p>Wilson 95% confidence interval.</p><button class="btn secondary" onclick="proportion()">Open</button></div><div class="card"><b>2 × 2 Table</b><p>Risk ratio, odds ratio and risk difference.</p><button class="btn secondary" onclick="twobytwo()">Open</button></div><div class="card"><b>Mean CI</b><p>Mean, SD and approximate 95% CI.</p><button class="btn secondary" onclick="meanCI()">Open</button></div></div>'}
function info(){title.textContent='Info and Help';sub.textContent='About this implementation';app.innerHTML='<div class="card"><h2>OpenEpi calculators</h2><p>This workspace follows the OpenEpi menu concept. The Screening module uses a standard diagnostic 2×2 table and a backend calculation engine so the browser is not responsible for the statistical result.</p><p class="note">Screening convention: a=TP, b=FP, c=FN, d=TN. 95% CIs for proportions use exact Clopper–Pearson intervals. Results should be checked against the official OpenEpi release before publication.</p></div>'}
function coming(name){title.textContent=name;sub.textContent='Calculator module';app.innerHTML='<div class="card"><h2>'+name+'</h2><p>This menu item is wired into the OpenEpi workspace. Its full statistical engine will be enabled only after formula validation; it will not show a fake result.</p></div>'}
function screening(){title.textContent='Screening';sub.textContent='Counts → Screening / diagnostic accuracy';app.innerHTML='<div class="card"><h2>Screening / Diagnostic Accuracy</h2><p>Enter the complete 2×2 table. The calculation runs through the backend validation engine.</p><div class="grid"><div class="field"><label>TP — Test + / Reference +</label><input id="tp" type="number" min="0" step="1" value=""></div><div class="field"><label>FP — Test + / Reference −</label><input id="fp" type="number" min="0" step="1" value=""></div><div class="field"><label>FN — Test − / Reference +</label><input id="fn" type="number" min="0" step="1" value=""></div><div class="field"><label>TN — Test − / Reference −</label><input id="tn" type="number" min="0" step="1" value=""></div></div><div class="actions"><button class="btn primary" onclick="calcScreening()">Calculate Screening</button><button class="btn secondary" onclick="screening()">Reset</button></div><div id="screenOut"></div><p class="note">Outputs: sensitivity, specificity, PPV, NPV, accuracy with exact 95% CIs; positive/negative likelihood ratios; diagnostic odds ratio; Youden J; F1 score; prevalence.</p></div>'}
async function calcScreening(){const ids=['tp','fp','fn','tn'];const v=ids.map(num);const out=$('screenOut');if(v.some(x=>!Number.isInteger(x)||x<0)){out.innerHTML='<div class="error">All four cells must be non-negative whole numbers.</div>';return}if(v.reduce((a,b)=>a+b,0)===0){out.innerHTML='<div class="error">Enter at least one observation.</div>';return}out.innerHTML='<div class="success">Calculating…</div>';try{const fd=new FormData();fd.append('config',JSON.stringify({tp:v[0],fp:v[1],fn:v[2],tn:v[3]}));const r=await fetch(API+'/api/v1/openeepi/screening',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Backend calculation failed');renderScreen(data.results)}catch(e){out.innerHTML='<div class="error">'+e.message+'<br>Make sure the Render backend is running.</div>'}}
function renderScreen(r){$('screenOut').innerHTML='<div class="success">Calculation completed by the validated OpenEpi backend.</div><div class="metrics"><div class="metric"><small>Sensitivity</small><b>'+pct(r.sensitivity)+'</b><small>95% CI '+pct(r.sensitivity_95ci[0])+' – '+pct(r.sensitivity_95ci[1])+'</small></div><div class="metric"><small>Specificity</small><b>'+pct(r.specificity)+'</b><small>95% CI '+pct(r.specificity_95ci[0])+' – '+pct(r.specificity_95ci[1])+'</small></div><div class="metric"><small>PPV</small><b>'+pct(r.ppv)+'</b><small>95% CI '+pct(r.ppv_95ci[0])+' – '+pct(r.ppv_95ci[1])+'</small></div><div class="metric"><small>NPV</small><b>'+pct(r.npv)+'</b><small>95% CI '+pct(r.npv_95ci[0])+' – '+pct(r.npv_95ci[1])+'</small></div></div><table class="table"><tr><th>Measure</th><th>Result</th></tr><tr><td>Accuracy</td><td>'+pct(r.accuracy)+' (95% CI '+pct(r.accuracy_95ci[0])+' – '+pct(r.accuracy_95ci[1])+')</td></tr><tr><td>Positive LR</td><td>'+val(r.positive_likelihood_ratio)+'</td></tr><tr><td>Negative LR</td><td>'+val(r.negative_likelihood_ratio)+'</td></tr><tr><td>Diagnostic Odds Ratio</td><td>'+val(r.diagnostic_odds_ratio)+'</td></tr><tr><td>Youden J</td><td>'+val(r.youden_j)+'</td></tr><tr><td>F1 score</td><td>'+val(r.f1_score)+'</td></tr><tr><td>Prevalence</td><td>'+pct(r.prevalence)+'</td></tr></table>'}
function proportion(){title.textContent='Proportion';sub.textContent='Counts → Proportion';app.innerHTML='<div class="card"><h2>Proportion</h2><div class="grid"><div class="field"><label>Events (x)</label><input id="px" type="number" min="0"></div><div class="field"><label>Total (n)</label><input id="pn" type="number" min="1"></div></div><div class="actions"><button class="btn primary" onclick="calcProp()">Calculate</button></div><div id="po"></div></div>'}function calcProp(){let x=num('px'),N=num('pn');if(!Number.isInteger(x)||!Number.isInteger(N)||N<1||x<0||x>N){$('po').innerHTML='<div class="error">Use integers with 0 ≤ x ≤ n.</div>';return}let p=x/N,z=1.959964,d=1+z*z/N,c=(p+z*z/(2*N))/d,h=z*Math.sqrt(p*(1-p)/N+z*z/(4*N*N))/d;$('po').innerHTML='<div class="metrics"><div class="metric"><small>Proportion</small><b>'+pct(p)+'</b></div><div class="metric"><small>Wilson 95% CI</small><b>'+pct(Math.max(0,c-h))+' – '+pct(Math.min(1,c+h))+'</b></div></div>'}
function twobytwo(){title.textContent='Two by Two Table';sub.textContent='Counts → 2×2 measures';app.innerHTML='<div class="card"><h2>2 × 2 Table</h2><div class="grid"><div class="field"><label>a</label><input id="a" type="number" min="0"></div><div class="field"><label>b</label><input id="b" type="number" min="0"></div><div class="field"><label>c</label><input id="c" type="number" min="0"></div><div class="field"><label>d</label><input id="d" type="number" min="0"></div></div><div class="actions"><button class="btn primary" onclick="calc22()">Calculate</button></div><div id="twoOut"></div></div>'}function calc22(){let a=num('a'),b=num('b'),c=num('c'),d=num('d');if([a,b,c,d].some(x=>!Number.isInteger(x)||x<0)){twoOut.innerHTML='<div class="error">Use non-negative whole numbers.</div>';return}let or=b*c? a*d/(b*c):null,rr=(a+b&&c+d)?(a/(a+b))/(c/(c+d)):null,rd=(a/(a+b))-(c/(c+d));twoOut.innerHTML='<div class="metrics"><div class="metric"><small>Odds Ratio</small><b>'+val(or)+'</b></div><div class="metric"><small>Risk Ratio</small><b>'+val(rr)+'</b></div><div class="metric"><small>Risk Difference</small><b>'+pct(rd)+'</b></div></div>'}
function rate(){coming('1 Rate — person-time rate calculation')};function meanCI(){title.textContent='Mean CI';sub.textContent='Continuous variables';app.innerHTML='<div class="card"><h2>Mean 95% CI</h2><div class="grid"><div class="field"><label>Mean</label><input id="m" type="number" step="any"></div><div class="field"><label>SD</label><input id="sd" type="number" min="0" step="any"></div><div class="field"><label>N</label><input id="mn" type="number" min="2" step="1"></div></div><div class="actions"><button class="btn primary" onclick="calcMean()">Calculate</button></div><div id="mo"></div></div>'}function calcMean(){let m=num('m'),sd=num('sd'),N=num('mn');if(!Number.isFinite(m)||!Number.isFinite(sd)||sd<0||!Number.isInteger(N)||N<2){mo.innerHTML='<div class="error">Enter valid mean, SD and N ≥ 2.</div>';return}let h=1.96*sd/Math.sqrt(N);mo.innerHTML='<div class="metrics"><div class="metric"><small>Mean</small><b>'+val(m)+'</b></div><div class="metric"><small>95% CI</small><b>'+val(m-h)+' – '+val(m+h)+'</b></div></div>'}function ttest(){coming('Independent t test')};function sampleSize(){coming('Sample Size')};function randomNumbers(){title.textContent='Random numbers';sub.textContent='Utilities';app.innerHTML='<div class="card"><h2>Random numbers</h2><div class="grid"><div class="field"><label>Minimum</label><input id="lo" type="number" value="1"></div><div class="field"><label>Maximum</label><input id="hi" type="number" value="100"></div><div class="field"><label>Count</label><input id="cnt" type="number" value="10" min="1" max="1000"></div></div><div class="actions"><button class="btn primary" onclick="rand()">Generate</button></div><div id="ro"></div></div>'}function rand(){let lo=Math.ceil(num('lo')),hi=Math.floor(num('hi')),c=Math.floor(num('cnt'));if(lo>hi||c<1||c>1000){ro.innerHTML='<div class="error">Check limits.</div>';return}let a=Array.from({length:c},()=>Math.floor(Math.random()*(hi-lo+1))+lo);ro.innerHTML='<div class="success">'+a.join(', ')+'</div>'}home();
</script></body></html>
