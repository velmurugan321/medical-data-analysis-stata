<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Variable Review · Medical Analytics Lab</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:14px Inter,system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #1720330a}.muted{color:#667085}.upload{display:block;border:2px dashed #cbd5e1;border-radius:16px;padding:28px;text-align:center;cursor:pointer}.upload input{display:none}button,select{border:0;border-radius:9px;padding:10px 13px;font:inherit}button{background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#edf4ff;color:#1d4ed8}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:top}th{background:#f8fafc;position:sticky;top:0}.high{color:#067647;font-weight:700}.review{color:#b54708;font-weight:700}.warn{color:#b54708;background:#fffaeb;padding:8px;border-radius:8px}.summary{display:flex;gap:10px;flex-wrap:wrap}.summary span{padding:7px 10px;background:#f8fafc;border:1px solid #e5e9f2;border-radius:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.code{font-family:ui-monospace,monospace}.hidden{display:none}</style></head><body><main><div class="card"><div class="muted">MEDICAL ANALYTICS LAB · VARIABLE REVIEW</div><h1>Confirm variables before analysis</h1><p class="muted">This is the analysis safety gate. Detection is automatic, but meaning is confirmed before statistical modelling. Raw values are never silently recoded.</p><label class="upload"><b>Choose Excel workbook(s)</b><br><span class="muted">Up to 10 files · XLSX / XLS / XLSM</span><input id="files" type="file" multiple accept=".xlsx,.xls,.xlsm"></label><div id="list"></div><div class="actions"><button id="inspect" disabled>Inspect & review</button><button id="reset" class="secondary">Reset</button></div></div><div id="out"></div></main><script>const API='https://medical-data-analysis-api.onrender.com';const $=x=>document.getElementById(x);let reviewed={};$('files').onchange=()=>{const fs=[...$('files').files];$('inspect').disabled=!fs.length||fs.length>10;$('list').innerHTML=fs.map(f=>`<p>✓ ${esc(f.name)}</p>`).join('')};$('reset').onclick=()=>location.reload();function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function key(file,sheet,name){return file+'|'+sheet+'|'+name}function needs(v){return v.confidence<.9||v.warnings?.length||/code|categorical|binary/i.test(v.detected_type)}$('inspect').onclick=async()=>{const fd=new FormData();[...$('files').files].forEach(f=>fd.append('files',f));$('inspect').disabled=true;$('out').innerHTML='<div class="card">Inspecting every sheet and variable…</div>';try{const r=await fetch(`${API}/api/v1/data/inspect-workbooks`,{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());render(await r.json())}catch(e){$('out').innerHTML=`<div class="card warn">${esc(e.message)}</div>`}finally{$('inspect').disabled=false}};function render(data){reviewed={};let total=0,need=0;for(const f of data.files)for(const s of f.sheets)for(const v of s.variables||[]){total++;const n=needs(v);if(n)need++;reviewed[key(f.filename,s.sheet,v.name)]=!n}let html=`<div class="card"><h2>Review gate</h2><div class="summary"><span>${data.file_count} file(s)</span><span>${total} variable(s)</span><span class="warn">${need} require confirmation</span></div><p class="muted">For numeric codes such as <span class="code">1/2/3</span>, choose whether they are categories or continuous. For M/F, Y/N and similar values, confirm the intended categorical meaning.</p><div class="actions"><button id="accept">Accept high-confidence detections</button><button id="proceed" disabled>Proceed to analysis</button></div></div>`;for(const f of data.files){html+=`<div class="card"><h2>${esc(f.filename)}</h2>`;for(const s of f.sheets){if(s.status==='error'){html+=`<p class="warn">${esc(s.sheet)}: ${esc(s.error)}</p>`;continue}html+=`<h3>${esc(s.sheet)} <span class="muted">${s.rows} rows · ${s.columns} columns</span></h3><div class="table"><table><thead><tr><th>Variable</th><th>Detected</th><th>N</th><th>Missing</th><th>Unique</th><th>Examples</th><th>Confidence</th><th>Confirm</th><th>Warnings</th></tr></thead><tbody>`;for(const v of s.variables){const k=key(f.filename,s.sheet,v.name),n=needs(v);html+=`<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.detected_type)}</td><td>${v.n}</td><td>${v.missing} (${v.missing_percent}%)</td><td>${v.unique}</td><td>${esc((v.examples||[]).join(', '))}</td><td class="${v.confidence>=.9?'high':'review'}">${v.confidence_percent}%</td><td>${n?`<select data-k="${esc(k)}"><option value="">Select</option><option value="numeric">Continuous numeric</option><option value="binary">Binary categorical</option><option value="categorical">Categorical / ordinal</option><option value="date/time">Date / time</option><option value="identifier">Identifier</option><option value="text">Text</option></select>`:'✓ Accepted'}</td><td>${v.warnings?.length?`<span class="warn">${esc(v.warnings.join('; '))}</span>`:'—'}</td></tr>`}html+='</tbody></table></div>'}html+='</div>'}html+=`<div class="card"><b>Safety rule:</b> all variables selected for analysis must have confirmed semantics. This page does not change the original dataset.</div>`;$('out').innerHTML=html;document.querySelectorAll('select[data-k]').forEach(s=>s.onchange=()=>{reviewed[s.dataset.k]=!!s.value;update()});$('accept').onclick=()=>{document.querySelectorAll('select[data-k]').forEach(s=>{s.value='categorical';reviewed[s.dataset.k]=true});update()};update()}function update(){const ok=Object.values(reviewed).length>0&&Object.values(reviewed).every(Boolean);$('proceed').disabled=!ok;if(ok)$('proceed').textContent='✓ All variables confirmed — proceed to analysis'} </script></body></html>
