<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dummy Table Analysis | Medical Analytics Lab</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1250px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 25px #0f172a0b}.hero{background:linear-gradient(135deg,#0b1324,#1d4ed8);color:#fff}.upload,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.drop,.field{padding:14px;border:1px solid #e5e7eb;border-radius:12px;background:#fafcff}.drop{border:2px dashed #cbd5e1;text-align:center}.drop input{display:block;margin:12px auto;max-width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#edf4ff;color:#1d4ed8}.btn:disabled{opacity:.5}.status{padding:12px;border-radius:10px;margin-top:14px}.ok{background:#ecfdf3;color:#067647}.err{background:#fff1f2;color:#b42318}.info{background:#eff6ff;color:#1d4ed8}.note{font-size:12px;color:#667085}.sheet{border:1px solid #dbe3ef;border-radius:14px;margin:12px 0;overflow:hidden}.sheet h3{margin:0;padding:12px 14px;background:#f8fafc}.vars{display:flex;flex-wrap:wrap;gap:7px;padding:12px}.var{padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.table select,.field input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}.table select{min-width:260px}.progress{display:none}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#2563eb}.logs{background:#0b1220;color:#d7e1f0;border-radius:12px;margin-top:12px}.logs-head{padding:9px;font-size:12px;font-weight:800}.logbox{max-height:180px;overflow:auto;padding:10px;font:12px/1.5 monospace}.success{padding:16px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:13px}.download{display:inline-block;margin-top:12px;padding:11px 15px;border-radius:9px;background:#067647;color:#fff;text-decoration:none}@media(max-width:760px){.upload,.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head>
<body><main class="wrap"><div style="display:flex;justify-content:space-between;margin-bottom:18px"><b>Medical Analytics Lab</b><a href="./index.html">← Dashboard</a></div>
<section class="card hero"><h1>Dataset → All Sheets → Dummy Table → Results</h1><p>All worksheets in an uploaded Excel workbook are inspected and shown. Every detected variable can be reviewed and manually selected.</p></section>
<section class="card"><div class="upload"><label class="drop"><b>01 · Dataset(s)</b><input id="dataset" type="file" multiple accept=".csv,.xlsx,.xls,.xlsm,.dta,.tsv,.ods,.sav,.sas7bdat,.json,.txt,.docx"><div id="dn" class="note">No dataset selected</div></label><label class="drop"><b>02 · Dummy table</b><input id="dummy" type="file" accept=".xlsx,.xls,.docx"><div id="tn" class="note">No dummy table selected</div></label></div><div class="actions"><button class="btn primary" id="plan" disabled>Analyze & Match Variables</button><button class="btn secondary" id="clear">Reset</button></div><div id="status"></div></section>
<section class="card" id="workbook" style="display:none"></section><section class="card" id="mapping" style="display:none"></section>
<section class="card" id="config" style="display:none"><h2>03 · Confirm analysis settings</h2><div class="grid"><label class="field"><b>Outcome variable</b><select id="outcome"><option value="">Select outcome</option></select><small>All detected variables are available.</small></label><label class="field"><b>Positive/event value(s)</b><input id="positive" placeholder="Example: Unfavourable, Yes, 1"><small id="positiveHint"></small></label><label class="field" style="grid-column:1/-1"><b>Adjustment variables</b><input id="adjust" placeholder="Optional: age, gender, income, occupation"></label></div><button class="btn primary" id="run">Run statistical analysis →</button></section>
<section class="card progress" id="progress"><div style="display:flex;justify-content:space-between"><b id="stage">Queued</b><b id="pct">0%</b></div><div class="bar"><i id="bar"></i></div><div class="logs"><div class="logs-head">Analysis log · <span id="logcount">0</span> events</div><div id="logbox" class="logbox"></div></div></section><section class="card" id="result" style="display:none"></section></main>
<script>
const API='https://medical-data-analysis-api.onrender.com', $=id=>document.getElementById(id); let datasets=[],dummy=null,planData=null,timer=null,allVars=[],manualMapping={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ready(){$('plan').disabled=!(datasets.length&&dummy)} function status(t,c='info'){$('status').innerHTML='<div class="status '+c+'">'+esc(t)+'</div>'}
$('dataset').onchange=e=>{datasets=[...e.target.files];$('dn').textContent=datasets.length?datasets.map(x=>x.name).join(', '):'No dataset selected';ready()};$('dummy').onchange=e=>{dummy=e.target.files[0]||null;$('tn').textContent=dummy?dummy.name:'No dummy table selected';ready()};$('clear').onclick=()=>location.reload();
async function inspectAll(){let fd=new FormData();datasets.forEach(f=>fd.append('files',f));let r=await fetch(API+'/api/v1/data/inspect-workbooks',{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw Error(j.detail||'Workbook inspection failed');return j}
function renderWorkbook(j){let h='<h2>All sheets & variables</h2>';j.files.forEach(f=>{h+='<div class="sheet"><h3>'+esc(f.filename)+' · '+esc(f.sheet_count)+' sheet(s)</h3>';f.sheets.forEach(s=>{h+='<div class="sheet"><h3>📑 '+esc(s.sheet)+' · '+esc(s.rows??0)+' rows · '+esc(s.columns??0)+' variables</h3><div class="vars">'+(s.variables||[]).map(v=>'<span class="var" title="'+esc(v.detected_type)+'">'+esc(v.name)+'</span>').join('')+'</div></div>'});h+='</div>'});$('workbook').innerHTML=h;$('workbook').style.display='block'}
function variableOptions(selected){let vals=[...new Set(allVars.map(x=>x.key))];return '<option value="">— Not mapped —</option>'+vals.map(k=>{let x=allVars.find(v=>v.key===k);return '<option value="'+esc(k)+'"'+(k===selected?' selected':'')+'>'+esc(x.label)+'</option>'}).join('')}
function renderPlan(r){let rows=(r.rows_spec||[]).filter(x=>x.analysis!=='variable heading');let h='<h2>Variable matching report</h2><p class="note">Every Dataset variable used field contains variables from all workbook sheets.</p><table class="table"><thead><tr><th>Dummy variable / row</th><th>Dataset variable used <b>(editable)</b></th><th>Confidence</th><th>Why matched</th></tr></thead><tbody>';rows.forEach((x,i)=>{let key=String(x.label||'row_'+i),sel=manualMapping[key]||x.variable||'';h+='<tr><td>'+esc(key)+'</td><td><select class="map" data-key="'+esc(key)+'">'+variableOptions(sel)+'</select></td><td>'+esc(x.confidence??0)+'</td><td>'+esc(x.match_reason||'Needs review')+'</td></tr>'});h+='</tbody></table><button class="btn secondary" id="resetMap" type="button">Reset manual mappings</button>';$('mapping').innerHTML=h;$('mapping').style.display='block';document.querySelectorAll('.map').forEach(e=>e.onchange=()=>manualMapping[e.dataset.key]=e.value);$('resetMap').onclick=()=>{manualMapping={};renderPlan(r)};
let oc=r.outcome_candidates||[];$('outcome').innerHTML='<option value="">Select outcome</option>'+allVars.map(v=>'<option value="'+esc(v.key)+'">'+esc(v.label)+'</option>').join('');if(oc.length){let hit=allVars.find(v=>v.key===oc[0].variable||v.name===oc[0].variable);if(hit)$('outcome').value=hit.key;$('positive').value=oc[0].values?.[1]||oc[0].values?.[0]||''}$('config').style.display='block'}
$('plan').onclick=async()=>{if(!datasets.length||!dummy)return;$('plan').disabled=true;status('Reading every sheet and every variable…');try{let j=await inspectAll();allVars=[];j.files.forEach(f=>f.sheets.forEach(s=>(s.variables||[]).forEach(v=>allVars.push({key:f.filename+'::'+s.sheet+'::'+v.name,name:v.name,label:f.filename+' · '+s.sheet+' · '+v.name}))));renderWorkbook(j);let fd=new FormData();fd.append('dataset',datasets[0]);fd.append('dummy_table',dummy);let r=await fetch(API+'/api/v1/dummy-table/analyze-template',{method:'POST',body:fd}),x=await r.json();if(!r.ok)throw Error(x.detail||'Template analysis failed');planData=x.results||{};renderPlan(planData);status('All sheets loaded. Manual variable selection is ready.','ok')}catch(e){status(e.message,'err')}finally{ready()}};
$('run').onclick=async()=>{if(!$('outcome').value){status('Select the outcome variable.','err');return}status('Starting analysis…');$('progress').style.display='block';$('run').disabled=true;let selected=$('outcome').value;let outcomeVar=selected.split('::').pop();let fd=new FormData();datasets.forEach(f=>fd.append('dataset',f));fd.append('dummy_table',dummy);fd.append('outcome',outcomeVar);fd.append('outcome_positive',$('positive').value.trim());fd.append('adjustment_variables',$('adjust').value.trim());fd.append('manual_variable_mapping',JSON.stringify(manualMapping));try{let r=await fetch(API+'/api/v1/jobs/dummy-table/start',{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw Error(j.detail||'Could not start analysis');poll(j.job_id)}catch(e){status(e.message,'err');$('run').disabled=false}};
async function poll(id){let r=await fetch(API+'/api/v1/jobs/'+id),p=await r.json();$('pct').textContent=(p.percent??0)+'%';$('bar').style.width=(p.percent??0)+'%';$('stage').textContent=p.stage||'Analysing';$('logcount').textContent=(p.logs||[]).length;$('logbox').innerHTML=(p.logs||[]).map(x=>'<div>'+esc(x.level||'INFO')+' '+esc(x.message)+'</div>').join('');if(p.status==='completed'){let meta=p.meta||{};$('result').style.display='block';$('result').innerHTML='<div class="success"><h2>Analysis completed</h2><p>Rows: '+esc(meta.rows_in_dataset||'—')+'</p><p>Outcome: '+esc(meta.outcome_variable||$('outcome').value)+'</p><a class="download" href="'+API+'/api/v1/jobs/'+id+'/download" target="_blank">Download filled Excel result</a></div>';status('Final result generated.','ok');$('run').disabled=false;return}if(p.status==='failed'){status(p.error||'Analysis failed','err');$('run').disabled=false;return}timer=setTimeout(()=>poll(id),900)}
</script></body></html>
