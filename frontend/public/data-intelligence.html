<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Intelligence · Medical Analytics Lab</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:14px Inter,system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #1720330a}.muted{color:#667085}.upload{display:block;border:2px dashed #cbd5e1;border-radius:16px;padding:28px;text-align:center;cursor:pointer}.upload input{display:none}button,select{border:0;border-radius:9px;padding:10px 13px;font:inherit}button{background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#edf4ff;color:#1d4ed8}.bar{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb;width:0;transition:.25s}.file{padding:7px 0;border-bottom:1px solid #eef1f6}.sheet{margin-top:20px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;margin:3px;font-size:12px}.warn{color:#b54708;background:#fffaeb;padding:8px;border-radius:9px}.ok{color:#067647}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1150px}th,td{padding:8px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap;vertical-align:top}th{background:#f8fafc;position:sticky;top:0}.high{color:#067647;font-weight:700}.medium{color:#b54708;font-weight:700}.low{color:#b42318;font-weight:700}.confirm{display:flex;gap:6px;align-items:center}.confirm select{border:1px solid #cbd5e1;background:#fff}.examples{max-width:260px;white-space:normal}.summary{display:flex;gap:10px;flex-wrap:wrap}.summary span{padding:7px 10px;background:#f8fafc;border:1px solid #e5e9f2;border-radius:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}@media(max-width:700px){main{padding:12px}}</style></head><body><main><div class="card"><div class="muted">MEDICAL ANALYTICS LAB · DATA INTELLIGENCE</div><h1>Workbook & Variable Intelligence</h1><p class="muted">Upload up to 10 Excel workbooks. Every non-empty worksheet is inspected. Numeric, text, short-code, binary, date and identifier candidates are profiled without silently changing the raw data.</p><label class="upload"><b>Choose 1–10 Excel files</b><br><span class="muted">XLSX / XLS / XLSM</span><input id="files" type="file" multiple accept=".xlsx,.xls,.xlsm"></label><div id="filelist"></div><div class="actions"><button id="run" disabled>Inspect all sheets & variables</button><button id="reset" class="secondary">Reset</button></div></div><div class="card" id="progress" hidden><b id="stage">Reading…</b><div class="bar"><i id="bar"></i></div><p id="msg" class="muted"></p></div><div id="results"></div></main><script>const API='https://medical-data-analysis-api.onrender.com';const files=document.querySelector('#files'),run=document.querySelector('#run'),list=document.querySelector('#filelist'),results=document.querySelector('#results'),progress=document.querySelector('#progress');let reviewed={};files.onchange=()=>{const a=[...files.files];run.disabled=!a.length||a.length>10;list.innerHTML=a.map(f=>`<div class="file">✓ ${esc(f.name)} · ${(f.size/1024).toFixed(1)} KB</div>`).join('')};$('reset').onclick=()=>location.reload();function $(id){return document.getElementById(id)}function esc(x){return String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function cls(c){return c>=.9?'high':c>=.75?'medium':'low'}function needs(v){return v.detected_type==='binary/code'||v.detected_type==='categorical/code'||v.warnings?.length>0||v.confidence<.9}run.onclick=async()=>{run.disabled=true;progress.hidden=false;$('stage').textContent='Uploading and profiling every workbook…';$('bar').style.width='15%';const fd=new FormData();[...files.files].forEach(f=>fd.append('files',f));try{const r=await fetch(`${API}/api/v1/jobs/data-intelligence`,{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());const data=await r.json();$('bar').style.width='100%';$('stage').textContent=`Completed · ${data.file_count} workbook(s)`;render(data)}catch(e){$('msg').textContent=e.message;$('stage').textContent='Inspection failed';$('bar').style.width='0%'}finally{run.disabled=false}};function render(data){reviewed={};let ambiguous=0,total=0;data.files.forEach(f=>f.sheets.forEach(s=>s.variables?.forEach(v=>{total++;if(needs(v))ambiguous++})));results.innerHTML=`<div class="card"><h2>Review before analysis</h2><p class="muted">The engine will never assume that numeric <code>1,2,3</code> means continuous, and it will not silently recode M/F, Y/N or other short codes. Variables marked review need confirmation.</p><div class="summary"><span>${data.file_count} file(s)</span><span>${total} variable(s)</span><span class="warn">${ambiguous} variable(s) need review</span></div><div class="actions"><button id="confirmAll" class="secondary">Accept high-confidence detections</button><button id="proceed" disabled>Proceed to analysis</button></div></div>`+data.files.map(file=>`<div class="card"><h2>${esc(file.filename)}</h2><p class="muted">${file.sheet_count} non-empty sheet(s) read</p>${file.sheets.map(s=>`<div class="sheet"><h3>${esc(s.sheet)} <span class="badge">${s.rows||0} rows · ${s.columns||0} columns</span></h3>${s.status==='error'?`<div class="warn">${esc(s.error)}</div>`:`<div class="table"><table><thead><tr><th>Variable</th><th>Detected</th><th>Raw type</th><th>N</th><th>Missing</th><th>Unique</th><th>Numeric parse</th><th>Examples</th><th>Confidence</th><th>Review / confirm</th><th>Warnings</th></tr></thead><tbody>${s.variables.map(v=>{const key=file.filename+'|'+s.sheet+'|'+v.name;reviewed[key]=!needs(v);return `<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.detected_type)}</td><td>${esc(v.raw_dtype)}</td><td>${v.n}</td><td>${v.missing} (${v.missing_percent}%)</td><td>${v.unique}</td><td>${v.numeric_parse_percent}%</td><td class="examples">${esc((v.examples||[]).join(', '))}</td><td class="${cls(v.confidence)}">${v.confidence_percent}%</td><td><div class="confirm">${needs(v)?`<select data-key="${esc(key)}"><option value="">Select…</option><option>continuous numeric</option><option>binary categorical</option><option>categorical/ordinal</option><option>date/time</option><option>identifier</option><option>text</option></select>`:'✓ High confidence'}</div></td><td>${v.warnings?.length?`<span class="warn">${esc(v.warnings.join('; '))}</span>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`}</div>`).join('')}</div>`).join('')}<div class="card"><b>Medical-data safety rule:</b> automatic detection is a screening step, not a guarantee of meaning. Variable names, value patterns and storage type are used together; ambiguous coding must be confirmed before statistical modelling.</div>`;document.querySelectorAll('select[data-key]').forEach(s=>s.onchange=()=>{reviewed[s.dataset.key]=!!s.value;updateProceed()});$('confirmAll').onclick=()=>{Object.keys(reviewed).forEach(k=>reviewed[k]=true);document.querySelectorAll('select[data-key]').forEach(s=>s.value='categorical/ordinal');updateProceed()};updateProceed()}function updateProceed(){const ok=Object.values(reviewed).every(Boolean);$('proceed').disabled=!ok;if(ok)$('proceed').textContent='✓ All variables reviewed — proceed to analysis';}</script></body></html>
