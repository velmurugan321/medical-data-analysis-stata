<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Intelligence · Medical Analytics Lab</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:14px Inter,system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #1720330a}h1{margin:0 0 8px;font-size:28px}.muted{color:#667085}.upload{border:2px dashed #cbd5e1;border-radius:16px;padding:30px;text-align:center;cursor:pointer}.upload input{display:none}button{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.bar{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb;width:0}.file{padding:8px 0;border-bottom:1px solid #eef1f6}.sheet{margin-top:18px}.sheet h3{margin-bottom:4px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;margin:3px;font-size:12px}.warn{color:#b54708;background:#fffaeb;padding:10px;border-radius:10px;margin:8px 0}.ok{color:#067647}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{background:#f8fafc}.high{color:#067647;font-weight:700}.medium{color:#b54708;font-weight:700}.low{color:#b42318;font-weight:700}</style></head><body><main><div class="card"><div class="muted">MEDICAL ANALYTICS LAB · DATA INTELLIGENCE</div><h1>Workbook & Variable Intelligence</h1><p class="muted">Upload multiple Excel workbooks. Every non-empty worksheet is read and every variable is profiled before statistical analysis.</p><label class="upload"><b id="label">Choose 1–10 Excel files</b><br><span class="muted">XLSX / XLS</span><input id="files" type="file" multiple accept=".xlsx,.xls"></label><div id="filelist"></div><br><button id="run" disabled>Inspect all sheets & variables</button></div><div class="card" id="progress" hidden><b id="stage">Reading…</b><div class="bar"><i id="bar"></i></div><p id="msg" class="muted"></p></div><div id="results"></div></main><script>const API='https://medical-data-analysis-api.onrender.com';const files=document.querySelector('#files'),run=document.querySelector('#run'),list=document.querySelector('#filelist'),results=document.querySelector('#results'),progress=document.querySelector('#progress');files.onchange=()=>{const a=[...files.files];run.disabled=!a.length||a.length>10;list.innerHTML=a.map(f=>`<div class="file">✓ ${f.name} · ${(f.size/1024).toFixed(1)} KB</div>`).join('')};function esc(x){return String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function cls(c){return c>=.9?'high':c>=.75?'medium':'low'}run.onclick=async()=>{run.disabled=true;progress.hidden=false;document.querySelector('#stage').textContent='Uploading and profiling…';document.querySelector('#bar').style.width='15%';const fd=new FormData();[...files.files].forEach(f=>fd.append('files',f));try{const r=await fetch(`${API}/api/v1/data/inspect-workbooks`,{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());const data=await r.json();document.querySelector('#bar').style.width='100%';document.querySelector('#stage').textContent=`Completed · ${data.file_count} file(s)`;render(data)}catch(e){document.querySelector('#msg').textContent=e.message;document.querySelector('#stage').textContent='Inspection failed';document.querySelector('#bar').style.width='0%'}finally{run.disabled=false}};function render(data){results.innerHTML=data.files.map(file=>`<div class="card"><h2>${esc(file.filename)}</h2><p class="muted">${file.sheet_count} sheet(s) read</p>${file.sheets.map(s=>`<div class="sheet"><h3>${esc(s.sheet)} <span class="badge">${s.rows||0} rows · ${s.columns||0} columns</span></h3>${s.status==='error'?`<div class="warn">${esc(s.error)}</div>`:`<div class="table"><table><thead><tr><th>Variable</th><th>Detected type</th><th>Raw type</th><th>N</th><th>Missing</th><th>Unique</th><th>Numeric %</th><th>Confidence</th><th>Recommended analysis</th><th>Warnings</th></tr></thead><tbody>${s.variables.map(v=>`<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.detected_type)}</td><td>${esc(v.raw_dtype)}</td><td>${v.n}</td><td>${v.missing} (${v.missing_percent}%)</td><td>${v.unique}</td><td>${v.numeric_parse_percent}%</td><td class="${cls(v.confidence)}">${v.confidence_percent}%</td><td>${esc(v.recommended_analysis)}</td><td>${v.warnings?.length?`<span class="warn">${esc(v.warnings.join('; '))}</span>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}</div>`).join('')}</div>`).join('')}</div>`).join('')}<div class="card"><b>Accuracy safeguard:</b> numeric values such as <code>1,2,3</code> are not automatically assumed to be continuous; they are flagged as possible codes when there are few unique values. Short letter values such as M/F or Y/N are identified as categorical candidates. Ambiguous variables must be confirmed before analysis.</div>`}</div>`).join('')}</div>`)};</script></body></html>
